[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowsocksx-ng-linux"
version = "0.2.0"
description = "A practical Shadowsocks desktop client for Linux/Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "fattoliu"}]
keywords = ["shadowsocks", "linux", "ubuntu", "proxy", "pac", "gfwlist"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/fattoliu/shadowsocksx-ng-linux"

[project.scripts]
ssx-ng-linux = "ssxng.launcher:main"
ssx-ng-tool = "ssxng.cli:main"

[tool.setuptools.packages.find]
include = ["ssxng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["ssxng"]
omit = [
  "ssxng/app.py",
  "ssxng/app_beta.py",
  "ssxng/app_ng_features.py",
  "ssxng/advanced_settings.py",
  "ssxng/feedback_ui4.py",
  "ssxng/modern_ui4.py",
  "ssxng/preferences_ng.py",
  "ssxng/server_manager.py",
  "ssxng/server_manager4.py",
  "ssxng/share_dialog.py",
  "ssxng/ui.py",
  "ssxng/runtime_ng.py",
  "ssxng/screen_qr.py",
  "ssxng/server_json.py",
  "ssxng/diagnostics.py",
  "ssxng/launcher.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# I001 is deliberately left to formatters; B904/UP037 are style-only and do
# not affect this GTK/system integration code. E501 is covered by line-length.
ignore = ["E501", "I001", "B904", "UP037"]

[tool.ruff.lint.per-file-ignores]
# PyGObject requires gi.require_version() before importing gi.repository, which
# necessarily puts the following project imports after executable statements.
"ssxng/app.py" = ["E402"]
"ssxng/feedback_ui4.py" = ["E402"]
"ssxng/modern_ui4.py" = ["E402"]
"ssxng/preferences_ng.py" = ["E402"]
"ssxng/server_manager.py" = ["E402"]
"ssxng/server_manager4.py" = ["E402"]
"ssxng/ui.py" = ["E402"]
