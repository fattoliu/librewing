[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowsocksx-ng-linux"
version = "0.2.0"
description = "A practical Shadowsocks desktop client for Linux/Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "fattoliu"}]
keywords = ["shadowsocks", "linux", "ubuntu", "proxy", "pac", "gfwlist"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/fattoliu/shadowsocksx-ng-linux"

[project.scripts]
ssx-ng-linux = "ssxng.launcher:main"
ssx-ng-tool = "ssxng.cli:main"

[tool.setuptools.packages.find]
include = ["ssxng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["ssxng"]
omit = ["ssxng/app.py", "ssxng/app_beta.py", "ssxng/server_manager.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
