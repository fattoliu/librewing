[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowsocksx-ng-linux"
version = "0.2.0"
description = "A practical Shadowsocks desktop client for Linux/Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "fattoliu"}]
keywords = ["shadowsocks", "linux", "ubuntu", "proxy", "pac", "gfwlist"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/fattoliu/shadowsocksx-ng-linux"

[project.scripts]
ssx-ng-linux = "ssxng.app:main"

[tool.setuptools.packages.find]
include = ["ssxng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
