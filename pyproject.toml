[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowsocksx-ng-linux"
version = "0.1.0"
description = "Linux desktop client inspired by ShadowsocksX-NG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "fattoliu"}]
dependencies = []

[project.scripts]
ssx-ng-linux = "ssxng.app:main"

[tool.setuptools.packages.find]
include = ["ssxng*"]
