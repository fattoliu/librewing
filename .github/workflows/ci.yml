name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q ssxng
      - name: Lint
        run: ruff check ssxng tests
      - name: Unit tests with branch coverage
        run: pytest -q --cov=ssxng --cov-branch --cov-report=term-missing

  desktop-smoke:
    name: Ubuntu desktop import smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            shadowsocks-libev privoxy libayatana-appindicator3-1 qrencode zbar-tools
      - name: Import GTK application and CLI modules
        run: |
          /usr/bin/python3 -m compileall -q ssxng
          PYTHONPATH=. /usr/bin/python3 -c 'import ssxng.app, ssxng.app_beta, ssxng.app_ng_features, ssxng.advanced_settings, ssxng.runtime_ng, ssxng.server_manager, ssxng.cli; print("desktop imports OK")'
          PYTHONPATH=. /usr/bin/python3 -c 'from ssxng.server_manager import CIPHERS; assert "aes-256-gcm" in CIPHERS and "chacha20-ietf-poly1305" in CIPHERS; print("cipher model OK")'
      - name: Verify required runtime commands
        run: |
          command -v ss-local
          command -v privoxy
          command -v gsettings
          command -v qrencode
          command -v zbarimg

  package-smoke:
    name: Debian package smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: bash scripts/build-deb.sh
      - name: Inspect package metadata and payload
        run: |
          DEB=$(ls dist/*.deb)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          dpkg-deb --contents "$DEB" | grep -q '/usr/bin/ssx-ng-linux$'
          dpkg-deb --contents "$DEB" | grep -q '/usr/bin/ssx-ng-tool$'
          dpkg-deb --contents "$DEB" | grep -q '/usr/share/applications/shadowsocksx-ng-linux.desktop$'
