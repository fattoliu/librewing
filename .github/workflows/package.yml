name: Package and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build deb
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.2.0+${GITHUB_SHA::7}"
          fi
          VERSION="$VERSION" ARCH="${{ matrix.arch }}" bash scripts/build-deb.sh
          DEB=$(ls dist/*.deb)
          DEB_NAME=$(basename "$DEB")
          (cd dist && sha256sum "$DEB_NAME" > "$DEB_NAME.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadowsocksx-ng-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: shadowsocksx-ng-linux-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "ShadowsocksX-NG Linux $GITHUB_REF_NAME" \
            --generate-notes
