name: Package and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deb:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build deb and SBOM
        id: artifacts
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_BASE="${VERSION%%-*}"
            VERSION_PRERELEASE="${VERSION#*-}"
            if [[ "$VERSION_PRERELEASE" != "$VERSION" ]]; then
              VERSION="${VERSION_BASE}~${VERSION_PRERELEASE}"
            fi
          else
            VERSION="$(python3 scripts/project_version.py --format debian)+${GITHUB_SHA::7}"
          fi
          VERSION="$VERSION" ARCH="${{ matrix.arch }}" bash scripts/build-deb.sh
          RAW_DEB=$(ls dist/*.deb)
          SOURCE_EPOCH=$(git show -s --format=%ct HEAD)
          python3 scripts/generate-sbom.py "$RAW_DEB" --source-date-epoch "$SOURCE_EPOCH"
          # GitHub release uploads normalize '~' to '.', so normalize before hashing.
          for artifact in dist/*; do
            SAFE_ARTIFACT="${artifact//\~/.}"
            if [[ "$SAFE_ARTIFACT" != "$artifact" ]]; then
              mv -- "$artifact" "$SAFE_ARTIFACT"
            fi
          done
          DEB=$(ls dist/*.deb)
          (cd dist && for artifact in *.deb *.spdx.json; do sha256sum "$artifact" > "$artifact.sha256"; done)
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "sbom=$(ls dist/*.spdx.json)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.deb }}
      - name: Attest SBOM
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.deb }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadowsocksx-ng-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.spdx.json
            dist/*.spdx.json.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shadowsocksx-ng-linux-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.deb.sha256 \
            dist/*.spdx.json dist/*.spdx.json.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "ShadowsocksX-NG Linux $GITHUB_REF_NAME" \
            --generate-notes "${RELEASE_FLAGS[@]}"
