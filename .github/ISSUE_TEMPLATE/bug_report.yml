name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include passwords, ss:// URLs, QR codes, or unredacted configuration.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu and desktop version
      placeholder: Ubuntu 24.04, GNOME 46, X11 or Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Redacted health output
      description: Output from ssx-ng-tool health; remove private data first.

